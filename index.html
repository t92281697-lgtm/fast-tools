<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fast Tools | 無料オンラインツール</title>
    <meta name="description" content="QRコード生成、パスワード生成など、無料で使える便利なオンラインツールを提供しています。ログイン不要ですぐに使えます。">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container nav">
        <a href="./" class="logo">⚡ Fast Tools</a>
    </div>
</header>

<main>

    <section class="hero">
        <div class="container">

            <h1>Fast Tools</h1>

            <p>
                無料・高速・ログイン不要のオンラインツール
            </p>

            <input
                type="text"
                id="search"
                placeholder="🔍 ツールを検索..."
                autocomplete="off"
            >

        </div>
    </section>


    <section class="tools-section">

        <div class="container">

            <h2>⭐ 人気のツール</h2>

            <div class="grid">

                <a class="card" href="tools/qr-generator/">

                    <span class="badge">NEW</span>

                    <div class="icon">🔳</div>

                    <h3>QR Code Generator</h3>

                    <p>
                        URLや文字列からQRコードを無料で生成できます。
                    </p>

                </a>


                <a class="card" href="tools/password-generator/">

                    <span class="badge">NEW</span>

                    <div class="icon">🔐</div>

                    <h3>Password Generator</h3>

                    <p>
                        安全なランダムパスワードを簡単に生成できます。
                    </p>

                </a>


               <a class="card" href="tools/json-formatter/">

    <span class="badge">NEW</span>

    <div class="icon">📄</div>

    <h3>JSON Formatter</h3>

    <p>
        JSONを見やすく整形する無料ツール。
    </p>

</a>


                <a class="card" href="tools/uuid-generator/">

    <span class="badge">NEW</span>

    <div class="icon">🆔</div>

    <h3>UUID Generator</h3>

    <p>
        UUIDをすばやく生成するツール。
    </p>

</a>
            </div>

        </div>

    </section>

</main>


<footer>
    <div class="container">
        <p>© 2026 Fast Tools</p>
    </div>
</footer>


<script src="script.js"></script>

</body>
</html>
