<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード生成｜無料・ログイン不要 | Fast Tools</title>

    <meta
    name="description"
    content="URLや文字列からQRコードを無料で生成できるオンラインツール。ログイン不要ですぐに利用できます。"
>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="container">

<h1>QR Code Generator</h1>

<p>
URLや文字列を入力するだけで、無料でQRコードを生成できます。
</p>

<input
id="text"
placeholder="https://example.com"
>

<button onclick="makeQR()">
QRコード生成
</button>

<button onclick="downloadQR()">
📥 PNGで保存
</button>

<button onclick="clearQR()">
🗑️ クリア
</button>

<div id="qrcode"></div>

<section class="guide">

    <h2>QRコードの作り方</h2>

    <ol>
        <li>URLや文字列を入力します。</li>
        <li>「QRコード生成」をクリックします。</li>
        <li>表示されたQRコードを確認します。</li>
        <li>「PNGで保存」を押すと画像として保存できます。</li>
    </ol>

    <h2>こんなときに便利</h2>

    <p>
        WebサイトのURL、イベント情報、連絡先などを
        QRコードにしたいときに利用できます。
    </p>

    <p>
        インストールやログインは必要ありません。
        ブラウザ上ですぐに利用できます。
    </p>

</section>
</div>

<script src="script.js"></script>

</body>
</html>
