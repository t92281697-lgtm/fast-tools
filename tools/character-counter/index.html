<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>文字数カウンター | Fast Tools</title>
    <meta name="description" content="文章の文字数、空白を除いた文字数、行数などをリアルタイムで確認できる無料ツールです。">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <a href="../../" class="back">← Fast Tools</a>

    <h1>📝 文字数カウンター</h1>

    <p>
        文章を入力すると、文字数などをリアルタイムでカウントします。
    </p>

    <textarea
        id="text"
        placeholder="ここに文章を入力してください..."
    ></textarea>

    <div class="stats">

        <div class="stat">
            <span>文字数</span>
            <strong id="characters">0</strong>
        </div>

        <div class="stat">
            <span>空白なし</span>
            <strong id="noSpaces">0</strong>
        </div>

        <div class="stat">
            <span>行数</span>
            <strong id="lines">0</strong>
        </div>

        <div class="stat">
            <span>単語数</span>
            <strong id="words">0</strong>
        </div>

    </div>

    <button id="clearBtn">
        🗑️ クリア
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
